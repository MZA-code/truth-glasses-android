name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Action tierce épinglée par SHA : ce job manipule le keystore et peut écrire dans le dépôt
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Le tag doit correspondre à versionName, sinon l'APK publié porterait un autre numéro
      - name: Check version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but versionName $version"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          # Les espaces et retours à la ligne ajoutés au copier-coller sont ignorés
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (use: base64 -w0 release.jks)"
            exit 1
          fi

      - name: Build signed APK
        env:
          TG_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      # Vérifie la signature et publie l'empreinte SHA-256 à côté de l'APK
      - name: Verify and rename APK
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          apk="truth-glasses-$GITHUB_REF_NAME.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # gh est préinstallé sur les runners : pas d'action tierce pour publier
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "truth-glasses-$GITHUB_REF_NAME.apk" \
            "truth-glasses-$GITHUB_REF_NAME.apk.sha256" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
