name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      # Le tag doit correspondre à versionName, sinon l'APK publié porterait un autre numéro
      - name: Check version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but versionName $version"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret KEYSTORE_BASE64 missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          TG_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      # Vérifie la signature et publie l'empreinte SHA-256 à côté de l'APK
      - name: Verify and rename APK
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          apk="truth-glasses-$GITHUB_REF_NAME.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            truth-glasses-${{ github.ref_name }}.apk
            truth-glasses-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
